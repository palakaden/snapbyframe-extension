<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Snap by Frame Offscreen Recorder</title>
</head>
<body style="margin:0;padding:0;overflow:hidden;">
  <video id="record-video" autoplay playsinline muted style="position:fixed;top:0;left:0;width:2px;height:2px;opacity:0.01;pointer-events:none;"></video>
  <canvas id="record-canvas" style="position:fixed;top:0;left:0;opacity:0.01;pointer-events:none;"></canvas>
  <script src="offscreen.js"></script>
</body>
</html>
